# 목적 - GCP dev 환경에서 k8s/base를 환경별 값으로 패치하기 위해 추가됨
# 설명 - Terraform dev Artifact Registry 출력값, dev host, dev CORS origin을 한 overlay에서 관리해 base manifest를 직접 수정하지 않게 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base

patches:
  - path: ingress-patch.yaml
  - path: client-deployment-patch.yaml
  - path: server-configmap-patch.yaml
  - path: server-deployment-patch.yaml
  - path: server-uploads-pvc-patch.yaml

images:
  - name: seoul-vibe-client
    newName: asia-northeast3-docker.pkg.dev/seoul-vibe/seoul-vibe-dev-client/client
    newTag: ff9ecc6
  - name: seoul-vibe-server
    newName: asia-northeast3-docker.pkg.dev/seoul-vibe/seoul-vibe-dev-server/server
    newTag: ff9ecc6
