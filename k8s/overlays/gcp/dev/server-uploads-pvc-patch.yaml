# 목적 - GCP dev 환경에서 업로드 PVC에 기본 Persistent Disk StorageClass를 연결하기 위해 추가됨
# 설명 - 저비용 dev 배포를 위해 ReadWriteOnce standard-rwo 디스크를 사용하고, 다중 replica/RWX는 추후 Filestore 또는 GCS 전략으로 분리한다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seoul-vibe-server-uploads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
