# 목적 - GCP dev의 단일 저비용 노드에서 클라이언트를 실행하기 위해 추가됨
# 설명 - GKE 시스템 Pod가 이미 CPU request를 많이 사용하므로 dev에서는 replica와 request를 낮춘다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seoul-vibe-client
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: client
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
