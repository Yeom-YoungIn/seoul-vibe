# 목적 - prod 환경에서 k8s/base를 환경별 값으로 패치하기 위해 추가됨
# 설명 - Terraform prod ECR 출력값, 운영 host, 운영 CORS origin을 한 overlay에서 관리해 dev/prod 배포 입력을 분리한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml
  - path: server-configmap-patch.yaml

images:
  - name: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/seoul-vibe-client
    newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/seoul-vibe-prod-client
    newTag: sha-placeholder
  - name: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/seoul-vibe-server
    newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/seoul-vibe-prod-server
    newTag: sha-placeholder
