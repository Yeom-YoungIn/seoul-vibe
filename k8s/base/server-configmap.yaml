# 목적 - 백엔드 서버의 비민감 운영 설정을 Kubernetes에서 주입하기 위해 추가됨
# 설명 - 포트, 실행 환경, CORS, ORM 명명 전략 같은 일반 설정값을 ConfigMap으로 분리한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seoul-vibe-server-config
data:
  NODE_ENV: production
  PORT: "3000"
  TYPEORM_SYNC: "false"
  DB_NAMING_STRATEGY: snake
  CORS_ORIGIN: https://seoul-vibe.example.com
