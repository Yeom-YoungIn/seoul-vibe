# 목적 - 백엔드 Pod를 클러스터 내부에서 안정적으로 참조하기 위해 추가됨
# 설명 - client nginx 프록시와 Ingress 뒤의 내부 통신이 사용할 server ClusterIP Service를 정의한다.
apiVersion: v1
kind: Service
metadata:
  name: seoul-vibe-server
  labels:
    app.kubernetes.io/name: seoul-vibe-server
    app.kubernetes.io/part-of: seoul-vibe
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seoul-vibe-server
  ports:
    - name: http
      port: 3000
      targetPort: http
