# 목적 - 백엔드에 필요한 Secret 키 목록을 예시로 제공하기 위해 추가됨
# 설명 - 실제 비밀값은 넣지 않고, Terraform이나 배포 파이프라인이 생성해야 할 환경 변수 키를 문서화한다.
apiVersion: v1
kind: Secret
metadata:
  name: seoul-vibe-server-env
  namespace: seoul-vibe
type: Opaque
stringData:
  DB_HOST: CHANGE_ME
  DB_PORT: "5432"
  DB_USER: CHANGE_ME
  DB_PASS: CHANGE_ME
  DB_NAME: CHANGE_ME
  JWT_ACCESS_SECRET: CHANGE_ME
  JWT_REFRESH_SECRET: CHANGE_ME
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  JWT_REFRESH_EXPIRES_MS: "604800000"
  MAIL_HOST: CHANGE_ME
  MAIL_PORT: "587"
  MAIL_USER: CHANGE_ME
  MAIL_PASS: CHANGE_ME
