# 목적 - 프론트엔드 클라이언트 Pod 배포 기본값을 정의하기 위해 추가됨
# 설명 - nginx 기반 client 이미지, health probe, 내부 SERVER_UPSTREAM 환경값, 리소스 요청/제한을 포함한 EKS 배포 템플릿이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seoul-vibe-client
  labels:
    app.kubernetes.io/name: seoul-vibe-client
    app.kubernetes.io/part-of: seoul-vibe
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seoul-vibe-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seoul-vibe-client
        app.kubernetes.io/part-of: seoul-vibe
    spec:
      containers:
        - name: client
          image: seoul-vibe-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: SERVER_UPSTREAM
              value: http://seoul-vibe-server:3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
