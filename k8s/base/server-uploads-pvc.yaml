# 목적 - 업로드 파일을 여러 서버 Pod가 공유할 수 있도록 영속 볼륨을 연결하기 위해 추가됨
# 설명 - ReadWriteMany 접근 모드와 EFS 스타일 storage class를 사용해 업로드 경로를 재시작/다중 replica 환경에서 유지한다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seoul-vibe-server-uploads
  labels:
    app.kubernetes.io/name: seoul-vibe-server
    app.kubernetes.io/part-of: seoul-vibe
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 5Gi
