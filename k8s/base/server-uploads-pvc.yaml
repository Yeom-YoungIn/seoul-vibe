# 목적 - 업로드 파일을 여러 서버 Pod가 공유할 수 있도록 영속 볼륨을 연결하기 위해 추가됨
# 설명 - ReadWriteMany 접근 모드는 공통으로 유지하고, provider별 storage class는 cloud overlay에서 패치한다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seoul-vibe-server-uploads
  labels:
    app.kubernetes.io/name: seoul-vibe-server
    app.kubernetes.io/part-of: seoul-vibe
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
