# 목적 - 외부 트래픽을 프론트엔드 서비스로 라우팅하기 위해 수정됨
# 설명 - base는 공통 HTTP 라우팅만 제공하고, ingress class와 provider annotation은 cloud overlay에서 패치한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seoul-vibe
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seoul-vibe-client
                port:
                  name: http
