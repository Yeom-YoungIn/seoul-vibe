# 목적 - 외부 트래픽을 프론트엔드 서비스로 라우팅하기 위해 수정됨
# 설명 - base는 인증서가 없어도 적용 가능한 HTTP ALB Ingress만 제공하고, 실제 host/TLS 설정은 환경 overlay에서 패치한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seoul-vibe
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seoul-vibe-client
                port:
                  name: http
