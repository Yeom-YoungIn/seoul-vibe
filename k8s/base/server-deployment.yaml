# 목적 - 백엔드 서버 Pod 배포 기본값을 정의하기 위해 추가됨
# 설명 - server 이미지, Secret/ConfigMap 주입, health probe, 업로드 볼륨 마운트, 리소스 설정을 포함한 EKS 배포 템플릿이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seoul-vibe-server
  labels:
    app.kubernetes.io/name: seoul-vibe-server
    app.kubernetes.io/part-of: seoul-vibe
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seoul-vibe-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seoul-vibe-server
        app.kubernetes.io/part-of: seoul-vibe
    spec:
      containers:
        - name: server
          image: seoul-vibe-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: seoul-vibe-server-config
            - secretRef:
                name: seoul-vibe-server-env
          volumeMounts:
            - name: uploads
              mountPath: /app/packages/server/dist/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: seoul-vibe-server-uploads
