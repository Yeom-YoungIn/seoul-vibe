# 목적 - 프론트엔드 Pod를 클러스터 내부에서 노출하기 위해 추가됨
# 설명 - Ingress가 참조할 수 있도록 client Deployment를 ClusterIP Service로 연결한다.
apiVersion: v1
kind: Service
metadata:
  name: seoul-vibe-client
  labels:
    app.kubernetes.io/name: seoul-vibe-client
    app.kubernetes.io/part-of: seoul-vibe
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seoul-vibe-client
  ports:
    - name: http
      port: 80
      targetPort: http
