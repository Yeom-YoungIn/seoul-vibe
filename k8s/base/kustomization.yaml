# 목적 - Kubernetes base 리소스를 한 번에 조합하기 위해 추가됨
# 설명 - namespace, deployment, service, ingress, PVC를 묶고 cloud/environment overlay가 이미지와 provider별 값을 바꿔 끼울 수 있게 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: seoul-vibe

resources:
  - namespace.yaml
  - server-configmap.yaml
  - server-uploads-pvc.yaml
  - server-deployment.yaml
  - server-service.yaml
  - client-deployment.yaml
  - client-service.yaml
  - ingress.yaml
