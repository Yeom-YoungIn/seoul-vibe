# 목적 - 기존 배포 구성과 별도로 무료 API 서비스를 정의한다.
# 설명 - DB와 이미지는 외부 저장소에 두고 비밀값은 Render에서 입력한다.
services:
  - type: web
    name: seoul-vibe-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.server
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: 'production'
      - key: PORT
        value: '3000'
      - key: DB_SSL
        value: 'true'
      - key: DB_NAMING_STRATEGY
        value: 'snake'
      - key: TYPEORM_SYNC
        value: 'false'
      - key: STORAGE_DRIVER
        value: 's3'
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: MAIL_PORT
        value: '587'
      - key: MAIL_SECURE
        value: 'false'
      - key: JWT_ACCESS_EXPIRES_IN
        value: '15m'
      - key: JWT_REFRESH_EXPIRES_IN
        value: '7d'
      - key: JWT_REFRESH_EXPIRES_MS
        value: '604800000'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: SEO_INDEXABLE
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SEND_ENABLED
        sync: false
