# 목적 - main 반영 시 클라이언트를 Cloudflare Pages에 자동 배포한다 (wb의 Deploy Frontend와 같은 방식).
# 설명 - 검증 후 VITE_API_URL로 빌드하고, Functions 런타임 변수 API_ORIGIN을 담은 wrangler.toml을 생성해 functions/와 함께 직접 업로드한다.
#        필요한 설정: secrets.CLOUDFLARE_API_TOKEN, secrets.CLOUDFLARE_ACCOUNT_ID, vars.API_ORIGIN (Render API 주소),
#        선택 vars.CLOUDFLARE_PAGES_PROJECT_NAME (기본: 저장소 이름).
name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'packages/client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || github.event.repository.name }}

    steps:
      - name: Check required settings
        run: |
          missing=""
          [ -n "$API_ORIGIN" ] || missing="$missing vars.API_ORIGIN"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secrets.CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:client

      - name: Functions test
        run: npm --workspace packages/client run test:functions

      - name: Build
        run: npm run build:client
        env:
          VITE_API_URL: ${{ vars.API_ORIGIN }}

      - name: Write Pages config
        working-directory: packages/client
        # API_ORIGIN은 Functions(SEO 조각, sitemap/robots 프록시)가 런타임에 읽는다
        run: |
          cat > wrangler.toml <<TOML
          name = "${PROJECT_NAME}"
          pages_build_output_dir = "./dist"
          compatibility_date = "2026-10-01"

          [vars]
          API_ORIGIN = "${API_ORIGIN}"
          TOML

      - name: Ensure Pages project exists
        working-directory: packages/client
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Pages project $PROJECT_NAME exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        id: pages
        working-directory: packages/client
        run: |
          DEPLOY_OUTPUT="$(npx --yes wrangler@4 pages deploy \
            --project-name "$PROJECT_NAME" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$GITHUB_SHA")"
          echo "$DEPLOY_OUTPUT"
          DEPLOYMENT_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | awk '/https:\/\/.*\.pages\.dev/ {print $NF; exit}')"
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Deployment URL
        if: steps.pages.outputs.deployment_url != ''
        run: 'echo "Cloudflare Pages deployment: ${{ steps.pages.outputs.deployment_url }}"'
